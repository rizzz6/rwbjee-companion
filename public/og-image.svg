<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="1000" cy="100" r="40" fill="#ffffff" opacity="0.1"/>

  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    WBJEE College Predictor
  </text>

  <!-- Subtitle -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#ffffff">
    2025 - Free College Finder Tool
  </text>

  <!-- Description -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e0e7ff">
    Find engineering colleges and branches in West Bengal
  </text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e0e7ff">
    based on your WBJEE rank
  </text>

  <!-- Features -->
  <text x="300" y="420" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">
    ✓ Instant Results
  </text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">
    ✓ Mobile Friendly
  </text>
  <text x="900" y="420" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">
    ✓ Completely Free
  </text>

  <!-- URL -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#bfdbfe">
    rwbjee.com
  </text>

  <!-- WBJEE Logo/Icon -->
  <rect x="550" y="480" width="100" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e40af">
    WBJEE
  </text>
  <text x="600" y="525" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">
    2025
  </text>
</svg>